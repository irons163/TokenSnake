name: Release DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      signing_mode:
        description: '試建簽章模式；正式 GitHub Release 一律要求 Developer ID 與公證'
        type: choice
        required: true
        default: ad-hoc
        options: [ad-hoc, developer-id]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - name: Select Xcode 26+
        run: bash Scripts/select-release-xcode.sh
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project and validate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || 'false' }}
        run: |
          set -euo pipefail
          xcodegen generate
          python3 Scripts/release_metadata.py --tag "$RELEASE_TAG" \
            --prerelease "$RELEASE_PRERELEASE" --github-output "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test release validation
        run: python3 -m unittest discover -s Scripts/tests -v
      - name: Run application tests
        run: |
          xcodebuild test -project TokenSnake.xcodeproj -scheme TokenSnake \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TokenSnakeTests.xcresult" CODE_SIGNING_ALLOWED=NO -quiet
      - name: Preserve failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-test-results
          path: ${{ runner.temp }}/TokenSnakeTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  build-dmg:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - id: arm64
            label: apple-silicon
          - id: x86_64
            label: intel
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Select Xcode 26+
        run: bash Scripts/select-release-xcode.sh
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Archive, sign, notarize, and package
        env:
          TOKENSNAKE_ARCH: ${{ matrix.arch.id }}
          TOKENSNAKE_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TOKENSNAKE_SIGNING_MODE: ${{ github.event_name == 'release' && 'developer-id' || inputs.signing_mode }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash Scripts/package-ci-release.sh
      - name: Upload release build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch.label }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
            dist/*.build.json
            dist/appcast-*.xml
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'release'
    needs: [validate, build-dmg]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout validated release verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Download both architecture builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify and attach assets to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          actual_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]] || { echo 'Release tag moved after validation' >&2; exit 1; }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          manifests=[json.loads(p.read_text()) for p in Path('dist').glob('*.build.json')]
          assert len(manifests)==2 and {m['architecture'] for m in manifests}=={'arm64','x86_64'}
          assert all(m['signingMode']=='developer-id' and m['notarized'] is True for m in manifests)
          assert all(m['commit']==os.environ['EXPECTED_SHA'] and m['version']==os.environ['PACKAGE_VERSION'] for m in manifests)
          PY
          (cd dist; for checksum in *.sha256; do sha256sum --check "$checksum"; done)
          for arch in arm64 x86_64; do
            label=apple-silicon
            [[ "$arch" != x86_64 ]] || label=intel
            build="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["buildNumber"])' "dist/TokenSnake-$PACKAGE_VERSION-$label.build.json")"
            python3 Scripts/verify-update-feed.py "dist/appcast-$arch.xml" \
              --dmg "dist/TokenSnake-$PACKAGE_VERSION-$label.dmg" --version "$PACKAGE_VERSION" --arch "$arch" --build "$build"
          done
          # Stable asset names keep README downloads on the latest release.
          for label in apple-silicon intel; do
            cp "dist/TokenSnake-$PACKAGE_VERSION-$label.dmg" "dist/TokenSnake-$label.dmg"
          done
          (cd dist; sha256sum TokenSnake-apple-silicon.dmg TokenSnake-intel.dmg > TokenSnake-downloads.sha256)
          gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.zip dist/*.sha256 dist/*.build.json --clobber
          # GitHub's latest release URL excludes prereleases, preserving stable routing.
          gh release upload "$RELEASE_TAG" dist/appcast-*.xml --clobber
