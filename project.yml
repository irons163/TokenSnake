name: TokenSnake
options:
  bundleIdPrefix: app.tokensnake
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  TokenSnake:
    type: application
    platform: macOS
    sources:
      - path: TokenSnake
        excludes:
          - "**/.DS_Store"
    dependencies:
      - sdk: libsqlite3.tbd
      - package: Sparkle
    info:
      path: TokenSnake/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: "https://github.com/irons163/TokenSnake/releases/latest/download/appcast-$(TOKENSNAKE_UPDATE_ARCH).xml"
        SUPublicEDKey: "p/fa9He4cNgyOyGcznnadkWqt/x1jxJumos9huma504=" # gitleaks:allow -- public update verification key
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 3600
        SUEnableSystemProfiling: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tokensnake.TokenSnake
        PRODUCT_NAME: TokenSnake
        MARKETING_VERSION: "1.4.3"
        CURRENT_PROJECT_VERSION: "15"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: TokenSnake
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 TokenSnake"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        TOKENSNAKE_UPDATE_ARCH: "$(NATIVE_ARCH_ACTUAL)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: TokenSnake/TokenSnake.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ENABLE_TESTABILITY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    entitlements:
      path: TokenSnake/TokenSnake.entitlements
  TokenSnakeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TokenSnakeTests
    dependencies:
      - target: TokenSnake
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tokensnake.TokenSnakeTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TokenSnake.app/Contents/MacOS/TokenSnake
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_TESTABILITY: YES
schemes:
  TokenSnake:
    build:
      targets:
        TokenSnake: all
        TokenSnakeTests: [test]
    test:
      gatherCoverageData: true
      environmentVariables:
        TOKEN_SNAKE_TEST_MODE: "1"
      targets:
        - TokenSnakeTests

